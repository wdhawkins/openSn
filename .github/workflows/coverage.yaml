name: Coverage

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - name: build
        shell: bash
        run: |
          module load cuda/13.3.1 python3/3.12.3 opensn/gcc/14
          cmake -DOPENSN_WITH_PYTHON_MODULE=ON -DOPENSN_WITH_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=89 --preset coverage
          cmake --build --preset coverage --clean-first -j64
          find build-coverage -name '*.gcda' -delete
          cmake -DOPENSN_WITH_PYTHON_MODULE=ON --preset coverage-native
          cmake --build --preset coverage-native --clean-first -j64
          find build-coverage-native -name '*.gcda' -delete
      - name: test
        shell: bash
        run: |
          module load cuda/13.3.1 python3/3.12.3 opensn/gcc/14
          .github/workflows/run-coverage-tests.sh
      - name: coveralls
        shell: bash
        run: |
          module load cuda/13.3.1 python3/3.12.3 opensn/gcc/14
          gcovr -r . --filter '^(framework|python|modules)/' --print-summary \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file \
            --coveralls coverage.json
          /opt/local/opensn/coveralls/bin/coveralls -c /opt/local/opensn/coveralls/.coveralls.yml -f coverage.json
      - name: upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-logs-coverage
          path: ${{ runner.temp }}/logs/*_log.txt
          if-no-files-found: ignore
          retention-days: 7
